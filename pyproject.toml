[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-argentina"
version = "0.1.0"
description = "Servidor MCP para datos económicos de Argentina"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MCP Argentina Contributors"}
]
keywords = ["mcp", "argentina", "economia", "dolar", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
mcp-argentina = "mcp_argentina.__main__:main"

[project.urls]
Homepage = "https://github.com/greydina/mcp-argentina"
Documentation = "https://github.com/greydina/mcp-argentina#readme"
Repository = "https://github.com/greydina/mcp-argentina"
Issues = "https://github.com/greydina/mcp-argentina/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
# Gradual strict mode - enable as we fix
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # MCP SDK has untyped decorators
# Temporarily relaxed (tech debt)
warn_return_any = false
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests that hit real APIs (deselect with '-m not slow')",
    "integration: integration tests",
]
addopts = "-m 'not slow'"
